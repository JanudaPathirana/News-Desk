<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register | NSBM NewsDesk</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100 auth-page">

<nav class="navbar navbar-expand-lg navbar-dark navbar-green no-print">
  <div class="container">
    <a class="navbar-brand fw-bold" href="index.html">NSBM <span>NewsDesk</span></a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="menu">
      <ul class="navbar-nav me-auto">
        <li class="nav-item">
          <a class="nav-link " href="index.html">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link " href="news.html">All News</a>
        </li>
        <li class="nav-item">
          <a class="nav-link " href="submit.html">Submit Article</a>
        </li>
        <li class="nav-item">
          <a class="nav-link " href="bookmarks.html">Saved</a>
        </li>
        <li class="nav-item">
          <a class="nav-link " href="subscriptions.html">Subscriptions</a>
        </li>
      </ul>
      <div>
        <a class="btn btn-sm btn-outline-light" href="login.html">Login</a>
        <a class="btn btn-sm btn-light-green" href="register.html">Register</a>
      </div>
    </div>
  </div>
</nav>

<main class="container py-4 flex-grow-1">
<div class="box login-box">
  <h2>Create Account</h2>
  <p class="text-muted">For students only.</p>
  <form>
    <div class="mb-3">
      <label class="form-label" for="name">Full name</label>
      <input class="form-control" id="name" name="name" type="text" required>
    </div>
    <div class="mb-3">
      <label class="form-label" for="sid">Student ID</label>
      <input class="form-control" id="sid" name="student_id" type="text" required>
    </div>
    <div class="mb-3">
      <label class="form-label" for="email">University email</label>
      <input class="form-control" id="email" name="email" type="email" required>
    </div>
    <div class="mb-3">
      <label class="form-label" for="password">Password</label>
      <input class="form-control" id="password" name="password" type="password" required minlength="8">
    </div>
    <div class="mb-3">
      <label class="form-label" for="password2">Confirm password</label>
      <input class="form-control" id="password2" name="password2" type="password" required minlength="8">
    </div>
    <button class="btn btn-green w-100">Register</button>
  </form>
  <p class="mt-3 mb-0 text-center">Already registered? <a href="login.html">Login</a></p>
</div>
</main>

<footer class="footer no-print">
  <div class="container text-center">
    NSBM NewsDesk - Campus News Management System | NSBM Green University &copy; 2026
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/main.js"></script>
</body>
</html>
