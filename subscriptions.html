<main class="container py-4 flex-grow-1">
<h1>Category Subscriptions</h1>
<p class="text-muted">Select the categories you like. Their news will show first on your home page.</p>

<form class="box">
  <div class="form-check mb-2">
    <input class="form-check-input" type="checkbox" id="c0" >
    <label class="form-check-label" for="c0">Academic</label>
  </div>
  <div class="form-check mb-2">
    <input class="form-check-input" type="checkbox" id="c1" checked>
    <label class="form-check-label" for="c1">Campus</label>
  </div>
  <div class="form-check mb-2">
    <input class="form-check-input" type="checkbox" id="c2" >
    <label class="form-check-label" for="c2">Clubs</label>
  </div>
  <div class="form-check mb-2">
    <input class="form-check-input" type="checkbox" id="c3" checked>
    <label class="form-check-label" for="c3">Events</label>
  </div>
  <div class="form-check mb-2">
    <input class="form-check-input" type="checkbox" id="c4" >
    <label class="form-check-label" for="c4">Sports</label>
  </div>
  <button class="btn btn-green mt-2">Save Subscriptions</button>
</form>
